notes:
- Canonical layer for books, chapters, technical reports, teaching materials and other identifiable texts.
- Lattes categories are retained as provenance and do not define the public-site taxonomy.
- No URL, project, software, supervision or file relationship is inferred without evidence.
- Seven Springer/LNCS chapter records that are manifestations of conference publications are intentionally not duplicated
  here.
- Simplifying Electronic Document Digital Signatures (2022) remains in the canonical Publications layer and is not duplicated
  here.
- V2.1 separates evidence state, archive-search state, historical context, and transverse academic relations.
