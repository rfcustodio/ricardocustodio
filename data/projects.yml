- id: modelo-simplificado-de-cifradores-de-bloco
  title: Modelo Simplificado de Cifradores de Bloco
  scope: project
  nature: research
  status: completed
  start: 1999
  end: 2001
  role: null
  summary: 'Neste projeto procuramos desenvolver modelos simplificados de cifradores simétricos de bloco. A primeira
    etapa da pesquisa consistiu na criação de uma metodologia com as principais caracteristicas e funcionalides
    que devem ser contempladas pelo modelo simplificado. Na segunda etapa estamos desenvolvendo dois modelos simplificados:
    o primeiro é um modelo simplificado do cifrador RC6 proposto pela empresa norteamericana RSA; o segundo é um
    modelo do cifrador Reijndal, cifrador este que está sendo definido como o próximo padrão AES. Os modelos simplificados
    terão várias utilidades, salientando-se uma descrição didática com vistas a facilitar o entendimento do cifrador
    pelos estudante e a possibilidade de analise da cifra, modificando algumas de suas característica com vistas
    a verificar possíveis fraquesas no algoritmo.'
  topics: []
  institutions: []
  outputs:
