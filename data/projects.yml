  scope: project
  nature: research
  status: completed
  start: 2021
  end: null
  role: null
  summary: Este projeto trata do problema de autenticidade, integridade, sigilo e preservação em longo prazo de
    documentos eletrônicos. Estamos interessado em novos métodos de assinatura digital de documentos eletrônicos.
    Tais métodos devem levar em consideração o uso de algoritmos de assinatura digital pós-quânticos e melhoria
    na forma de representação visual da assinatura digital. Em termos de sigilo, estamos interessados em como garantir
    o sigilo de documentos eletrônicos, tanto a curto prazo quanto em longo prazo. Estaremos estudando protocolos
    criptográficos adequados ao ciframento dos documentos, com possibilidade de gestão inteligente de chaves criptográficas.
