- id: votacao-digital
  title: Votação Digital
  scope: project
  nature: research
  status: completed
  start: 1999
  end: 2008
  role: null
  summary: Estamos desenvolvento um novo protocolo criptográfico, por nós denominado de Farnel, com o objetivo de
    viabilizar a implantação de um sistema de votação digital em redes de computadores. A idéia do Farnel partil
    da observação de como o sistema eleitoral brasileiro funciona. Nós criamos o conveito do voto digital assinado
    digitalmente e da urna digital. Esta última consiste de uma rede de mistura simulando a urna eleitoral trradiconal.
    Também está sendo implementado um protótipo com o protocolo sendo proposto na WEB e em WAP.
