- id: criptografia-aplicada-a-conformidade-regulatoria-e-a-protecao-de-dados-n
  title: Criptografia Aplicada à Conformidade Regulatória e à Proteção de Dados no Open Insurance
  scope: project
  nature: extension
  status: current
  start: 2025
  end: null
  role: null
  summary: 'O projeto de extensão Protocolos de Segurança para Open Insurance Integrando Criptografia Clássica e
    Pós-Quântica tem como contexto a transformação digital do setor segurador brasileiro impulsionada pela iniciativa
    Open Insurance, regulamentada pela Superintendência de Seguros Privados (SUSEP) e pelo Conselho Nacional de
    Seguros Privados (CNSP). Essa abertura de dados e serviços entre instituições demanda soluções avançadas de
    segurança da informação e de redução da dependência tecnológica de plataformas estrangeiras. O projeto tem como
    objetivo geral desenvolver, validar e difundir protocolos de segurança híbridos, combinando criptografia clássica
    e pós-quântica, para fortalecer a autonomia tecnológica nacional e a soberania digital no ecossistema de seguros
    abertos. Entre os objetivos específicos, destacam-se: - analisar requisitos e vulnerabilidades de segurança
    no Open Insurance; - modelar ameaças clássicas e quânticas; - projetar e implementar um protocolo híbrido de
    comunicação segura; - avaliar seu desempenho e resistência a ataques; e - promover ações de extensão voltadas
    à disseminação do conhecimento e à capacitação técnica de estudantes e profissionais. A metodologia combina
    pesquisa exploratória e aplicada, com levantamento bibliográfico, entrevistas com especialistas, análises qualitativas
    e quantitativas, desenvolvimento experimental e validação por meio de testes. As atividades serão conduzidas
    no LabSEC/UFSC, em cooperação com a SUSEP e o Open Insurance and Knowledge Lab (OPENIK), integrando ensino,
    pesquisa e extensão. Os resultados esperados incluem: desenvolvimento de um protótipo nacional de protocolo
    de segurança híbrido para Open Insurance; formação de recursos humanos especializados em criptografia e segurança
    digital; transferência de tecnologia para órgãos públicos e entidades do setor segurador; e contribuição efetiva
    à soberania tecnológica brasileira em infraestrutura crítica. O projeto reforça o papel da universidade como
    vetor de inovação e de cooperação tecnológica em áreas estratégicas para o país.'
  topics:
  - open-insurance
  - cryptography
  - data-protection
  - regulatory-compliance
  - information-security
