- id: autoridade-de-certificacao
  title: Autoridade de Certificação
  scope: project
  nature: technological-development
  status: completed
  start: 1999
  end: 2004
  role: null
  summary: 'Este projeto consiste no desenvolvimento de uma infra-estrutura de chave pública. Estamos usando os
    certificados digitais recomendados pelo CCITT X.509v3. O projeto está organizado em três módulo: o primeiro
    é a autoridade de certificação, responsável pela emissão do certificado digital. O segundo é a autoridade de
    registro, responsável em verificar a autenticidade do proprietário do certificado e autorizar a autoridade de
    certificação a emitir certificados digitais. O terceiro é o módulo público. Este útimo responsável pela interface
    com o usuário. Parte do sistema já está desenvolvido e o estamos utilizando no nosso departamento.'
  topics: []
