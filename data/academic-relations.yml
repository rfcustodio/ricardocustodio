schema_version: '1.0'
notes:
- Cross-entity academic relations are stored separately from entity metadata.
- Relations are evidence-bearing and deliberately conservative.
- associated-with does not imply identity, derivation, authorship, or causality.
- External targets may later be reconciled to canonical project/supervision IDs.
relation_types:
  research-output-of: The source is a research output associated with the target research line or project.
  associated-with-supervision: The source is directly associated with a supervised academic work.
  precursor-to: The source predates and is evidentially associated with a later academic artifact; no textual derivation
    is asserted.
  continued-by: The research line represented by the source is continued by a later artifact.
  historical-context: The target supplies institutional or normative context without asserting causality.
