# Canonical registry of software, technological products, research artifacts,
# and datasets for Ricardo Custódio's academic website.
#
# V1 provenance:
# - Based on the official Lattes XML updated on 2026-04-08.
# - Lattes contains 21 software records and 15 technological-product records.
# - Canonical objects may consolidate multiple Lattes records when they describe
#   the same technological object at different maturity stages.
# - No historical evolution is asserted unless supported by the source.
# - `related` expresses a non-directional relationship.
# - `family` groups technologically related objects without claiming succession.
# - `visibility: featured` is an editorial choice for the main Software & Data page.
# - `visibility: archive` preserves historical objects without overloading the main page.
# - V2 adds curated contemporary artifacts reconciled with the current project registry.
# - Contemporary records are deliberately conservative: no software/product is invented for a project
#   when a distinct technological object has not yet been identified.

families:
  - id: pki-management-suite
    title: "PKI Management Suite"
    summary: "Software for operating certification authorities at different levels of a public key infrastructure."

  - id: hsm-technology
    title: "HSM Technology"
    summary: "Software and technological products for secure cryptographic-key lifecycle management."

  - id: brazilian-digital-signature-reference-implementations
    title: "Brazilian Digital Signature Reference Implementations"
    summary: "Reference software and machine-readable policy artifacts supporting the Brazilian Digital Signature Standard."

  - id: civil-registration-digital-trust
    title: "Civil Registration Digital Trust Infrastructure"
    summary: "Technological artifacts supporting identity, certification, electronic records, and intelligent services for the Brazilian civil registration ecosystem."

artifact_types:
  software:
    label: "Software"
  ai-platform:
    label: "AI Platform"
  ai-component:
    label: "AI Component"
  digital-platform:
    label: "Digital Platform"
  digital-infrastructure:
    label: "Digital Infrastructure"
  proof-of-concept:
    label: "Proof of Concept"
  research-software:
    label: "Research Software"
  research-artifact:
    label: "Research Artifact"
  technological-product:
    label: "Technological Product"
  dataset:
    label: "Dataset"



