schema_version: '1.2'
controlled_types:
- keynote
- invited-talk
- conference-presentation
- workshop
- tutorial
- panel
- roundtable
- guest-lecture
- institutional-talk
- professional-talk
notes:
- Canonical registry of talks and public presentations, not a dump of all event participation.
- Attendance-only events, awards, reviewing roles, event organization, and courses taken are excluded.
- Titles are preserved from sources when available; normalized titles are explicitly noted.
- Source provenance is kept separately so Lattes, institutional pages, and later archival evidence can be reconciled.
- '2012–2019 web audit: records are included only when an independent source establishes an actual presentation; conference
  chairing, program-committee membership, event organization, and mere coauthorship are excluded.'
- V1.2 adds ten editorial Selected Talks representing trajectory and thematic breadth, not citation, prestige, or recency
  ranking.
