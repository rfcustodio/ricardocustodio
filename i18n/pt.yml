  historical_trajectory: Trajetória Histórica
  historical_trajectory_intro: O arquivo organiza minha trajetória acadêmica como uma sequência de períodos de pesquisa sobrepostos. Os rótulos dos períodos identificam temas dominantes, e não fronteiras rígidas.
  research_genealogies: Genealogias de Pesquisa
  research_genealogies_intro: Estas genealogias mostram continuidades de pesquisa de longa duração entre projetos, publicações, software, textos, orientações e palestras. Sua sequência é histórica e editorial; por si só, não afirma causalidade ou derivação.
  about_archive: Sobre este Arquivo
  about_archive_intro: Este arquivo é baseado em evidências e centrado em metadados. Os registros canônicos permanecem em suas coleções originais, enquanto esta página oferece contexto histórico e interpretação entre coleções. Lacunas são preservadas quando a evidência documental é incompleta.
