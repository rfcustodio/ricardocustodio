  research_genealogies: Genealogías de Investigación
  research_genealogies_intro: Estas genealogías muestran continuidades de investigación de larga duración entre proyectos, publicaciones, software, textos, dirección académica y conferencias. Su secuencia es histórica y editorial; por sí sola no afirma causalidad ni derivación.
  about_archive: Sobre este Archivo
  about_archive_intro: Este archivo se basa en evidencias y está centrado en metadatos. Los registros canónicos permanecen en sus colecciones originales, mientras esta página ofrece contexto histórico e interpretación entre colecciones. Las lagunas se preservan cuando la evidencia documental es incompleta.
